{% if is_paginated %}<nav class="pagination" aria-label="Pagination"><span>Showing page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="button button-quiet" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="button button-quiet" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}">Next</a>{% endif %}</div></nav>{% endif %}
