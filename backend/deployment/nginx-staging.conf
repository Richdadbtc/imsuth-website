map $http_x_forwarded_proto $paypoint_forwarded_proto {
    default $scheme;
    https https;
}

limit_req_zone $binary_remote_addr zone=paypoint_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=paypoint_api:10m rate=120r/m;

upstream imsuth_paypoint_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name staging-paypoint.imsuth.org;
    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        proxy_pass http://imsuth_paypoint_web/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /paypoint/api/v1/session/login/ {
        limit_req zone=paypoint_login burst=5 nodelay;
        proxy_pass http://imsuth_paypoint_web/api/v1/session/login/;
        include /etc/nginx/paypoint-proxy-headers.conf;
    }

    location /paypoint/api/ {
        limit_req zone=paypoint_api burst=40 nodelay;
        proxy_pass http://imsuth_paypoint_web/api/;
        include /etc/nginx/paypoint-proxy-headers.conf;
    }

    location = /paypoint { return 301 /paypoint/; }

    location /paypoint/ {
        alias /srv/paypoint-ui/;
        index index.html;
    }

    location = / { return 302 /paypoint/; }
    location / { return 404; }
}
