services:
  web:
    build:
      context: ..
    command: gunicorn -c gunicorn.conf.py config.wsgi:application
    env_file: production.env
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.5
    expose: ["8000"]
    secrets: [django_secret_key, postgres_password]
    networks: [app, data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto':'https','Host':'paypoint.imsuth.org'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build: {context: ..}
    command: celery -A config worker --loglevel=INFO --concurrency=2
    env_file: production.env
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    tmpfs: [/tmp:size=64m,noexec,nosuid,nodev]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    secrets: [django_secret_key, postgres_password]
    networks: [app, data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: {context: ..}
    command: celery -A config beat --loglevel=INFO --schedule=/var/run/celery/celerybeat-schedule
    env_file: production.env
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    tmpfs: [/tmp:size=32m,noexec,nosuid,nodev]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    volumes: [celerybeat_data:/var/run/celery]
    secrets: [django_secret_key, postgres_password]
    networks: [app, data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - ./nginx-paypoint.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-headers.conf:/etc/nginx/paypoint-proxy-headers.conf:ro
      - ../../website/paypoint:/srv/paypoint-ui:ro
    networks: [app]
    depends_on:
      web: {condition: service_healthy}
    ports:
      - "127.0.0.1:18081:8080"

  db:
    image: postgres:17-alpine
    env_file: production.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 1g
    cpus: 2.0
    volumes: [postgres_data:/var/lib/postgresql/data]
    secrets: [postgres_password]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --save 60 1000 --maxmemory 192mb --maxmemory-policy noeviction
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid,nodev]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
  postgres_password:
    file: ./secrets/postgres_password
