name: Deploy IMSUTH website to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imsuth-cpanel-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v7

      - name: Validate public website files
        working-directory: website
        run: |
          set -euo pipefail
          for file in assets/js/*.js; do node --check "$file"; done
          for file in paypoint/config.js paypoint/static/paypoint/*.js; do node --check "$file"; done
          for file in data/*.json; do python3 -m json.tool "$file" >/dev/null; done
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
          for file in api/*.php; do php -l "$file"; done

      - name: Assemble public release
        run: |
          set -euo pipefail
          mkdir -p release/assets release/data release/api release/paypoint
          cp website/index.html website/about.html website/departments.html website/department-details.html website/services.html website/service-details.html website/appointment.html website/contact.html website/doctors.html website/doctor-details.html website/patients.html website/facilities.html website/facility-details.html website/research.html website/news.html website/article.html website/careers.html website/privacy.html website/leadership-profile.html website/admin.html website/404.html release/
          cp website/robots.txt website/sitemap.xml website/.htaccess release/
          cp -R website/assets/css website/assets/images website/assets/js release/assets/
          cp website/data/*.json release/data/
          cp website/api/*.php release/api/
          cp website/paypoint/index.html website/paypoint/config.js release/paypoint/
          cp -R website/paypoint/static release/paypoint/

      - name: Configure cPanel SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy release to cPanel
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          REMOTE_PATH: ${{ secrets.CPANEL_REMOTE_PATH }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT//[[:space:]]/}"
          SSH_PORT="${SSH_PORT:-22}"
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$REMOTE_PATH"
          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]] || (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo "CPANEL_SSH_PORT must be a number between 1 and 65535."
            exit 1
          fi
          rsync -az --checksum --rsh="ssh -p ${SSH_PORT}" release/ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH%/}/"
